# ShadowCast viewer - mpv config.
# Loaded via --config-dir so it never touches a global mpv setup.
#
# TIMING SETTINGS ARE LOAD-BEARING. This block is the exact configuration that
# tested as "latency way better, no tearing". Four attempts to shave more
# latency each broke something; every one is recorded below as a do-not-repeat.
#
#   swapchain-depth=1     -> stutter/lag under load
#   audio-exclusive=yes   -> this pin is 44.1kHz-only but exclusive output only
#                            takes 48k, forcing a resample across two clocks
#                            -> periodic clicks
#   audio-buffer < 0.05   -> underruns = audible tearing
#   dshow audio_buffer_size 30 -> same, tearing
#   untimed=yes           -> KILLS AUDIO (no AO at all; docs pair it with
#                            --no-audio)
#   video-sync=desync     -> audio dead + video lag
# If you want to experiment, change ONE line and test it live.

# --- low latency ---------------------------------------------------------
profile=low-latency
# The profile sets audio-buffer=0, which underruns on USB capture and crackles.
# 0.05 is the tested floor - do not go lower.
audio-buffer=0.05
video-latency-hacks=yes
cache=no

# --- window --------------------------------------------------------------
# Exclusive fullscreen bypasses the Windows compositor (DWM), which otherwise
# holds an extra frame before anything reaches the panel. Only takes effect in
# fullscreen (press f); harmless windowed. Still vsynced, so no tearing.
d3d11-exclusive-fs=yes
force-window=immediate
title=ShadowCast
osc=no
osd-level=1
osd-duration=1500
cursor-autohide=1000
keep-open=no
stop-screensaver=yes

# --- picture -------------------------------------------------------------
# The source is 1080p but this monitor is 1440p, so fullscreen upscales 1.33x -
# that soft look is the upscale, not the capture. (Measured: capturing at
# 2560x1440 adds NO real detail, SSIM 0.991 vs a 1080p roundtrip - the dongle
# just upscales - and costs half the framerate. Don't.)
# Press z for a pixel-perfect 1:1 window, which beats any upscaler.
scale=ewa_lanczos4sharpest
# The capture is yuyv422 - chroma is half-width, so cscale matters as much as
# luma. Left unset it falls back to something much softer.
cscale=ewa_lanczos4sharpest
dscale=mitchell
sigmoid-upscaling=yes
correct-downscaling=yes
deband=no
dither-depth=auto

# CAS sharpening after the upscale. GPU-side, one pass. Toggle in-window with x.
glsl-shaders="~~/shaders/cas.glsl"

# --- capture output ------------------------------------------------------
screenshot-format=png
screenshot-png-compression=3
screenshot-template=ShadowCast-%tY%tm%td-%tH%tM%tS
