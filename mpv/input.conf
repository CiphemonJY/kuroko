# ShadowCast viewer - keybindings. mpv defaults still apply (f fullscreen,
# m mute, i stats, a aspect, 9/0 volume, alt+= zoom, arrows pan, q quit).

r  script-binding toggle-record
R  script-binding toggle-record

# Sharpening (CAS) - on by default, toggle to compare.
x  change-list glsl-shaders toggle "~~/shaders/cas.glsl" ; show-text "Sharpening toggled" 1500

# Retro CRT scanlines.
c  change-list glsl-shaders toggle "~~/shaders/scanlines.glsl" ; show-text "Scanlines toggled" 1500

# Audio sync trim. If audio still runs late, tap [ until it locks; ] if early.
# 20ms steps (mpv's default Ctrl+-/Ctrl++ move in coarse 100ms jumps).
[  add audio-delay -0.02 ; show-text "Audio ${audio-delay}s (- = earlier)" 1500
]  add audio-delay  0.02 ; show-text "Audio ${audio-delay}s" 1500
\  set audio-delay 0 ; show-text "Audio delay reset" 1500

# Pixel-perfect (nearest neighbour) vs smooth scaling - for retro consoles.
p  cycle-values scale nearest ewa_lanczossharp ; cycle-values dscale nearest mitchell ; show-text "Scaling: ${scale}" 1500

# Rotate 90 degrees (handheld/vertical sources).
t  cycle-values video-rotate 90 180 270 0 ; show-text "Rotate ${video-rotate}" 1500

# Aspect presets: source / 16:9 / 4:3 / stretch to window.
y  cycle-values video-aspect-override "-1" "16:9" "4:3" "no" ; show-text "Aspect ${video-aspect-override}" 1500

# 1:1 pixel mapping - no upscale at all, so this is the SHARPEST the 1080p
# source can look on a 1440p monitor. Fullscreen trades sharpness for size.
z  set fullscreen no ; set window-scale 1.0 ; show-text "1:1 pixel-perfect (sharpest)" 2000

h  show-text "ShadowCast keys\n  f fullscreen (upscaled)   z 1:1 sharpest\n  s screenshot   r record clip   m mute   9/0 volume\n  x sharpening   c scanlines    p nearest-neighbour\n  t rotate       y aspect       i stats/fps   q quit\n\n  [ audio earlier   ] audio later   \\ reset\n    (tap [ until sound matches picture)\n\nSource is 1080p, monitor is 1440p - fullscreen must\nupscale 1.33x. Press z for no upscaling at all." 8000
